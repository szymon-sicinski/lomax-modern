[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lomax-modern"
version = "0.1.0"
description = "Research and read-only tooling for The Adventures of Lomax (Psygnosis, 1996/97 PC)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Szymon" }]
keywords = ["retro", "reverse-engineering", "game-modding", "lemmings", "lomax"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment",
  "Topic :: Software Development :: Disassemblers",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lomax-modern = "lomax_modern.cli:main"

[project.urls]
Homepage = "https://github.com/PLACEHOLDER/lomax-modern"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "realgame: needs a real Lomax installation (LOMAX_GAME_DIR); skipped otherwise",
]
