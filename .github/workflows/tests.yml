name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Byte-compile
        run: python -m compileall -q src tests

      - name: Unit tests
        run: python -m pytest tests -m "not realgame" -q

      - name: CLI smoke test
        run: |
          lomax-modern --version
          python -m lomax_modern.cli doctor /nonexistent || test $? -eq 2
          python -m lomax_modern wld roundtrip || test $? -eq 2

  native:
    # The M4 renderer core (native/) is C99, built here only — never at
    # `pip install` time. The headless smoke binary renders synthetic scenes
    # and asserts the same golden B5G6R5 words the Python oracle asserts.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the C renderer
        run: make -C native smoke
      - name: Run the headless smoke test
        run: ./native/smoke
